// =====================================================================
// RealAntennas ground-station expansion: China CDSN + ESA EUDSN
// Data source: Wu Weiren et al., Status and prospect of Chinese deep
//              space TT&C network, SCIENTIA SINICA Informationis, 2020
//
// Working copy maintained under dsh_operation. New stations are added
// in the "Additional stations" section at the end of the @Mods block.
// =====================================================================

@Kopernicus:AFTER[zRealAntennas]:NEEDS[RealismOverhaul]
{
    @Body[Earth]
    {
        @PQS
        {
            @Mods
            {
                // ===================== CDSN: China Deep Space Network =====================

                // ---- Jiamusi Deep Space Station (CDSN, 66 m) ----
                City2
                {
                    name = JiamusiDeepSpaceStation
                    objectName = Jiamusi - Jiamusi
                    isKSC = False
                    lat = 46.4936                                     // North 46°29′37″
                    lon = 130.7700                                    // East 130°46′12″
                    alt = 350                                         // Altitude approx. 350 m
                    enabled = True
                    commnetStation = False
                    RACommNetStation = True
                    snapToSurface = True
                    snapHeightOffset = 0
                    up = 0.0, 1.0, 0.0
                    rotation = 0
                    order = 100

                    LOD
                    {
                        Value
                        {
                            visibleRange = 30000
                            keepActive = False
                            model = BUILTIN/Dish
                            scale = 0.1, 0.1, 0.1
                            delete = False
                        }
                    }

                    // Basic VHF/UHF antennas (common to all stations)
                    Antenna
                    {
                        referenceGain = 1
                        TxPower = 40
                        TechLevel = 0
                        RFBand = VHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }
                    Antenna
                    {
                        referenceGain = 3
                        TxPower = 40
                        TechLevel = 0
                        RFBand = UHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }

                    // S-band antenna
                    Antenna
                    {
                        referenceGain = 61                            // Estimated gain, dBi
                        referenceFrequency = 2250
                        TxPower = 70                                  // 10 kW (40 dBW) = 70 dBm
                        TechLevel = 9                                 // Built in 2013, corresponds to TL9
                        RFBand = S
                        AMWTemp = 83                                  // System noise temperature, back-calculated from G/T 41.8 dB/K
                        ModulationBits = 2                            // QPSK capable

                        // Future upgrade (TL10)
                        UPGRADE
                        {
                            TechLevel = 10
                            referenceGain = 62                        // Minor gain increase
                            AMWTemp = 75                              // Further noise reduction
                            ModulationBits = 4
                        }
                    }

                    // X-band antenna
                    Antenna
                    {
                        referenceGain = 68.3                          // Back-calculated from EIRP 108.3 dBW and TxPower 70 dBm
                        referenceFrequency = 8450
                        TxPower = 70                                  // 10 kW
                        TechLevel = 9
                        RFBand = X
                        AMWTemp = 32                                  // Back-calculated from G/T 53.3 dB/K
                        ModulationBits = 2

                        UPGRADE
                        {
                            TechLevel = 10
                            referenceGain = 69
                            TxPower = 73                              // 20 kW (possible future upgrade)
                            AMWTemp = 28
                            ModulationBits = 4
                        }
                    }
                }

                // ---- Kashi Deep Space Station (CDSN, 35 m) ----
                City2
                {
                    name = KashiDeepSpaceStation
                    objectName = Kashi - Kashi
                    isKSC = False
                    lat = 38.4430                                     // North 38°26′34.7″
                    lon = 76.7279                                     // East 76°43′40.3″
                    alt = 1300
                    enabled = True
                    commnetStation = False
                    RACommNetStation = True
                    snapToSurface = True
                    snapHeightOffset = 0
                    up = 0.0, 1.0, 0.0
                    rotation = 0
                    order = 100

                    LOD
                    {
                        Value
                        {
                            visibleRange = 30000
                            keepActive = False
                            model = BUILTIN/Dish
                            scale = 0.1, 0.1, 0.1
                            delete = False
                        }
                    }

                    // Basic VHF/UHF antennas (common to all stations)
                    Antenna
                    {
                        referenceGain = 1
                        TxPower = 40
                        TechLevel = 0
                        RFBand = VHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }
                    Antenna
                    {
                        referenceGain = 3
                        TxPower = 40
                        TechLevel = 0
                        RFBand = UHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }

                    // S-band antenna
                    Antenna
                    {
                        referenceGain = 53                            // Back-calculated from EIRP 93 dBW and TxPower 70 dBm
                        referenceFrequency = 2250
                        TxPower = 70                                  // 10 kW
                        TechLevel = 9
                        RFBand = S
                        AMWTemp = 40                                  // Back-calculated from G/T 37 dB/K
                        ModulationBits = 2

                        UPGRADE
                        {
                            TechLevel = 10
                            referenceGain = 54
                            AMWTemp = 35
                            ModulationBits = 4
                        }
                    }

                    // X-band antenna
                    Antenna
                    {
                        referenceGain = 64                            // Back-calculated from EIRP 104 dBW and TxPower 70 dBm
                        referenceFrequency = 8450
                        TxPower = 70                                  // 10 kW
                        TechLevel = 9
                        RFBand = X
                        AMWTemp = 25                                  // Back-calculated from G/T 50 dB/K
                        ModulationBits = 2

                        UPGRADE
                        {
                            TechLevel = 10
                            referenceGain = 65
                            TxPower = 73                              // 20 kW (future upgrade)
                            AMWTemp = 22
                            ModulationBits = 4
                        }
                    }

                    // Ka-band antenna
                    Antenna
                    {
                        referenceGain = 77                            // Estimated, derived from G/T 56 dB/K and noise temperature
                        referenceFrequency = 32000
                        TxPower = 61                                  // Approx. 1.26 kW (31 dBW) = 61 dBm
                        TechLevel = 9
                        RFBand = Ka
                        AMWTemp = 126                                 // Back-calculated from G/T 56 dB/K
                        ModulationBits = 2

                        UPGRADE
                        {
                            TechLevel = 10
                            referenceGain = 78
                            TxPower = 64                              // 2.5 kW
                            AMWTemp = 100
                            ModulationBits = 4
                        }
                    }
                }

                // ---- Argentina Deep Space Station (CDSN, 35 m) ----
                City2
                {
                    name = ArgentinaDeepSpaceStation
                    objectName = Argentina - Neuquen
                    isKSC = False
                    lat = -38.1914                                    // South 38°11′28.90″
                    lon = -70.1495                                    // West 70°8′58.20″
                    alt = 800
                    enabled = True
                    commnetStation = False
                    RACommNetStation = True
                    snapToSurface = True
                    snapHeightOffset = 0
                    up = 0.0, 1.0, 0.0
                    rotation = 0
                    order = 100

                    LOD
                    {
                        Value
                        {
                            visibleRange = 30000
                            keepActive = False
                            model = BUILTIN/Dish
                            scale = 0.1, 0.1, 0.1
                            delete = False
                        }
                    }

                    // Basic VHF/UHF antennas (common to all stations)
                    Antenna
                    {
                        referenceGain = 1
                        TxPower = 40
                        TechLevel = 0
                        RFBand = VHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }
                    Antenna
                    {
                        referenceGain = 3
                        TxPower = 40
                        TechLevel = 0
                        RFBand = UHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }

                    // S-band antenna (similar to Kashi, but TL10)
                    Antenna
                    {
                        referenceGain = 53
                        referenceFrequency = 2250
                        TxPower = 70
                        TechLevel = 10                                // Built in 2017, directly TL10
                        RFBand = S
                        AMWTemp = 40
                        ModulationBits = 2
                    }

                    // X-band antenna
                    Antenna
                    {
                        referenceGain = 64
                        referenceFrequency = 8450
                        TxPower = 70
                        TechLevel = 10
                        RFBand = X
                        AMWTemp = 25
                        ModulationBits = 2
                    }

                    // Ka-band antenna
                    Antenna
                    {
                        referenceGain = 77
                        referenceFrequency = 32000
                        TxPower = 61
                        TechLevel = 10
                        RFBand = Ka
                        AMWTemp = 126
                        ModulationBits = 2
                    }
                }

                // ===================== EUDSN: ESA Deep Space Network =====================

                // ---- New Norcia Deep Space Station (EUDSN, 35 m) ----
                City2
                {
                    name = NewNorciaDeepSpaceStation
                    objectName = New Norcia
                    isKSC = False
                    lat = -31.0482                                    // South 31°2′53.61″
                    lon = 116.1915                                    // East 116°11′29.40″
                    alt = 200
                    enabled = True
                    commnetStation = False
                    RACommNetStation = True
                    snapToSurface = True
                    snapHeightOffset = 0
                    up = 0.0, 1.0, 0.0
                    rotation = 0
                    order = 100

                    LOD
                    {
                        Value
                        {
                            visibleRange = 30000
                            keepActive = False
                            model = BUILTIN/Dish
                            scale = 0.1, 0.1, 0.1
                            delete = False
                        }
                    }

                    // Basic VHF/UHF antennas (common to all stations)
                    Antenna
                    {
                        referenceGain = 1
                        TxPower = 40
                        TechLevel = 0
                        RFBand = VHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }
                    Antenna
                    {
                        referenceGain = 3
                        TxPower = 40
                        TechLevel = 0
                        RFBand = UHF
                        AMWTemp = 1340.8
                        ModulationBits = 1
                    }

                    // S-band antenna (based on Table 4 ESA 35m data)
                    Antenna
                    {
                        referenceGain = 57                            // EIRP 97 dBW - Tx 40 dBW
                        referenceFrequency = 2250
                        TxPower = 70                                  // 10 kW
                        TechLevel = 9                                 // Built in 2003
                        RFBand = S
                        AMWTemp = 89                                  // Back-calculated from G/T 37.5 dB/K
                        ModulationBits = 2
                    }

                    // X-band antenna
                    Antenna
                    {
                        referenceGain = 67                            // EIRP 107 dBW - Tx 40 dBW
                        referenceFrequency = 8450
                        TxPower = 70
                        TechLevel = 9
                        RFBand = X
                        AMWTemp = 49                                  // Back-calculated from G/T 50.1 dB/K
                        ModulationBits = 2
                    }

                    // Ka-band antenna (design value)
                    Antenna
                    {
                        referenceGain = 75                            // Estimated, EIRP 101 dBW - Tx 26 dBW
                        referenceFrequency = 32000
                        TxPower = 56                                  // Approx. 0.4 kW (26 dBW) = 56 dBm
                        TechLevel = 9
                        RFBand = Ka
                        AMWTemp = 83                                  // Back-calculated from G/T 55.8 dB/K (assuming gain 75)
                        ModulationBits = 2
                    }
                }
                // ===================== Additional stations (DSH working area) =====================
                // New stations are appended here, one City2 block each. Then register
                // every new objectName in the matching network list inside
                // @RealAntennasCommNetParams at the bottom of this file.
                //
                // Template for a new station (copy, uncomment, fill in):
                //
                // City2
                // {
                //     name = NewStationName
                //     objectName = NewStationObjectName
                //     isKSC = False
                //     lat = 0.0
                //     lon = 0.0
                //     alt = 0
                //     enabled = True
                //     commnetStation = False
                //     RACommNetStation = True
                //     snapToSurface = True
                //     snapHeightOffset = 0
                //     up = 0.0, 1.0, 0.0
                //     rotation = 0
                //     order = 100
                //     LOD
                //     {
                //         Value
                //         {
                //             visibleRange = 30000
                //             keepActive = False
                //             model = BUILTIN/Dish
                //             scale = 0.1, 0.1, 0.1
                //             delete = False
                //         }
                //     }
                //     Antenna { ... }   // add VHF/UHF basics plus S/X/Ka as needed
                // }
            }
        }
    }
}

// ========== Add stations to home node types ==========
@RealAntennasCommNetParams:NEEDS[RealismOverhaul]
{
    @HomeNodeTypes
    {
        // Add Chinese deep space network home node
        %CDSN = Jiamusi - Jiamusi;Kashi - Kashi;Argentina - Neuquen
        // Add European deep space network home node
        // (Cebreros/Malargue removed: within 25 km of DSS 63 Madrid / DSA 3 Malargue)
        %EUDSN = New Norcia
        // New stations: append their objectName to the matching list above.
    }
}
