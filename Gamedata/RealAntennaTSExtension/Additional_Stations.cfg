// =====================================================================
// Additional ground stations (dsh_operation working copy)
// 18 stations; "Neuquen" from the source list already exists in the main cfg as ArgentinaDeepSpaceStation
// (paper coords 38°11'28.90"S / 70°8'58.20"W match the main cfg), not repeated here.
//
// Data sources:
// - Wikipedia "List of Chinese space tracking stations" and related articles
// - Dong Guangliang et al., J. Deep Space Exploration 2018
// - Yu Zhijian et al., J. Deep Space Exploration 2021
// - Online verification (CAS/ASI/CONAE/CNES/SSC/AIP/ITRF/DORIS etc.)
//
// Annotation rules:
// - Measured/paper values: noted inline with source
// - Gain estimate: G = 20lg(pi*D/lambda) + 10lg(eta),
// eta = 0.55 (0.6 for the Wuqing 70 m), S=2250 MHz / X=8450 MHz
// - Assumed values: TxPower 60 dBm (1 kW); AMWTemp S-band 150 K,
// X-band 90 K (no public data), marked "assumed" inline
// - Coordinate precision (station/island/town/city/range-level approx.) noted inline
// - Removed: Qingshan (23 km to Jiuquan), Kiruna (1 km to Esrange),
// Dongara (same site as SSC - Dongara, 46 km)
// - Stations without public antenna data keep only the standard VHF/UHF pair
// =====================================================================

