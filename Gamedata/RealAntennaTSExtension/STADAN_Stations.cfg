// =====================================================================
// NASA STADAN（Spacecraft Tracking and Data Acquisition Network）
// 1960s satellite tracking network, merged into STDN in 1971. Working copy (dsh_operation).
//
// Data sources:
//   - NASA-TM-X-69902《NASA Directory of Observation Station Locations》(1974)
// (referenced_articles/19740014777.pdf, station survey coords)
// - Wikipedia: Spacecraft_Tracking_and_Data_Acquisition_Network
// - Online verification (NASA historical documents etc.)
//
// Annotation rules:
// - Station coords: NASA 1974 survey or official sources; precision noted for approximations
// - Gain estimate: G = 20lg(pi*D/lambda) + 10lg(eta), eta=0.55
// - Assumed values: TxPower 60 dBm (1 kW), AMWTemp S-band 150 K (no public data)
// - Stations without public antenna data keep only the standard VHF/UHF pair
// - Excluded per 25 km rule: Goldstone/Santiago/Johannesburg/Tananarive/
// Carnarvon/Quito/Fairbanks/Ascension/Bermuda/Barstow (same site as
// existing stations or too close); Crete and Pakistan: no such stations
// - Edge case: Orroral Valley is ~25.8 km from DSS 43 Canberra, just above
// the threshold, kept per rule
// =====================================================================

@Kopernicus:AFTER[zRealAntennas]:NEEDS[RealismOverhaul]
{
    @Body[Earth]
    {
        @PQS
        {
            @Mods
            {
                // ======================== NASA STADAN stations ========================

